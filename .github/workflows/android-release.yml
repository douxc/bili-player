name: Android arm64 Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name != 'pull_request' && 'Release' || '' }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Check Android SDK tools
        run: sdkmanager --version
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            printf 'SIGNING_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            printf 'signed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'signed=false\n' >> "$GITHUB_OUTPUT"
            echo '::notice::No signing secret; this run produces an unsigned Release APK.'
          fi
      - name: Require signing for version releases
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.signed != 'true'
        run: |
          echo '::error::Set SIGNING_KEYSTORE_BASE64 before publishing a version tag.'
          exit 1
      - name: Test, lint and build Release
        env:
          SIGNING_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_STORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ github.event_name != 'pull_request' && (vars.SIGNING_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS) || '' }}
          SIGNING_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify and package APK
        id: package
        env:
          EXPECT_SIGNED: ${{ steps.signing.outputs.signed }}
        run: python3 scripts/package_release.py
      - name: Upload APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tingjian-${{ steps.package.outputs.version }}-arm64-release
          path: dist/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload mapping and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.*
            app/build/test-results/testReleaseUnitTest/
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"release.keystore").unlink(missing_ok=True)'
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tingjian-${{ needs.build.outputs.version }}-arm64-release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$VERSION"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --verify-tag --title "听见 $TAG" --generate-notes
