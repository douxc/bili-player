name: Publish verified 0.1.7
on:
  push:
    branches: ['release/publish-v0.1.7']
    paths: ['.github/workflows/publish-verified-0.1.7.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-v0.1.7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: douxc/bili-player
      RELEASE_SHA: 1b8316222ef2efd42f1f3256853e34e7880d4b1c
      VERIFIED_RUN: '39523141795'
      APK: tingjian-0.1.7-arm64-release.apk
      APK_SHA256: f162fc1c4f1f61355117b22fd2647cdd1748eabce1efc8f3d8d813b1c352502f
    steps:
      - name: Download the tested signed APK
        run: |
          test "$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" --jq .head_sha)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" --jq .conclusion)" = success
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name tingjian-0.1.7-arm64-release --dir dist
          cd dist
          sha256sum --check SHA256SUMS.txt
          printf '%s  %s\n' "$APK_SHA256" "$APK" | sha256sum --check -
      - name: Tag the verified commit
        run: |
          existing="$(gh api "repos/$GH_REPO/git/ref/tags/v0.1.7" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v0.1.7 -f sha="$RELEASE_SHA"
          fi
      - name: Publish the verified APK
        run: |
          gh release create v0.1.7 "dist/$APK" dist/SHA256SUMS.txt --repo "$GH_REPO" --verify-tag --title "听见 v0.1.7" --notes "修复锁屏、通知栏和系统媒体控制的上一 P／下一 P；首尾边界与应用内一致，暂停时切 P 立即播放目标 P。仅 arm64-v8a 正式签名包，沿用 0.1.6 签名。"
      - name: Remove the temporary publishing branch
        run: gh api --method DELETE "repos/$GH_REPO/git/refs/heads/release/publish-v0.1.7"
